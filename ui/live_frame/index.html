<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  #stack { position:relative; width:100%; }
  #stack iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:block;
    background:transparent; }
  #stack iframe.next { visibility:hidden; }
</style></head>
<body><div id="stack"></div>
<script>
/* Live frame (no streamlit-component-lib, no build step): shows an HTML document like
   st.iframe, but a new document is loaded into a hidden frame first and swapped in once it has
   loaded. The old picture stays on screen until then, so a panel never flashes blank when
   Python sends a new state; an unchanged document is left alone (its animation keeps running). */
function send(type, extra) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, extra), "*");
}
const stack = document.getElementById("stack");
let current = null, pending = null;
function show(doc) {
  if (doc === current) return;
  current = doc;
  if (pending) pending.remove();
  const f = document.createElement("iframe");
  f.className = "next";
  f.setAttribute("title", "panel");
  pending = f;
  f.addEventListener("load", () => {
    if (pending !== f) return;                      // superseded by a newer document
    pending = null;
    requestAnimationFrame(() => {                   // first paint of the new frame, then swap
      f.classList.remove("next");
      [...stack.children].forEach(c => { if (c !== f) c.remove(); });
    });
  });
  f.srcdoc = doc;
  stack.appendChild(f);
}
window.addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.type !== "streamlit:render") return;
  const a = d.args || {};
  stack.style.height = a.height + "px";
  send("streamlit:setFrameHeight", {height: a.height});
  show(a.doc || "");
});
send("streamlit:componentReady", {apiVersion: 1});
</script>
</body></html>

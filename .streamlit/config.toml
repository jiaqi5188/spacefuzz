# SpaceFuzz dark theme (plan 4.3): black background, neon green, highlight yellow,
# alert red, grey.
[theme]
base = "dark"
primaryColor = "#40d317"
backgroundColor = "#05070a"
secondaryBackgroundColor = "#0f141b"
textColor = "#e6edf3"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false   # no telemetry: the app must run with the network off

[server]
headless = true
# No source-file watching: after every script run Streamlit rescans all loaded modules on
# its event loop (thousands with pandas, scipy, plotly, pyarrow; polling, no watchdog);
# that held back page switches by 7-24 s during a forecast. Restart after code changes.
fileWatcherType = "none"
